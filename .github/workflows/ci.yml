name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  ECR_DB_REPOSITORY: ${{ vars.ECR_DB_REPOSITORY }}
  HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
  SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

jobs:
  build-and-sonar:
    if: github.event_name == 'push'
    name: Build, Test, Checkstyle & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Cache Sonar scanner cache
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('sonar-project.properties') }}
          restore-keys: |
            ${{ runner.os }}-sonar-

      - name: Build, run unit tests, and generate Checkstyle report
        run: mvn clean verify checkstyle:checkstyle -B

      - name: Run SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: SonarQube quality gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          pollingTimeoutSec: 600

  docker-build-push:
    if: github.event_name == 'push'
    needs: build-and-sonar
    name: Build and push images to ECR
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.meta.outputs.ecr_registry }}
      app_image: ${{ steps.meta.outputs.app_image }}
      db_image: ${{ steps.meta.outputs.db_image }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Create ECR repositories if needed
        run: |
          for repo in "$ECR_REPOSITORY" "$ECR_DB_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1 || \
              aws ecr create-repository --repository-name "$repo"
          done

      - name: Resolve image names
        id: meta
        run: |
          ECR_REGISTRY=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_REGION}.amazonaws.com
          echo "ecr_registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "app_image=${ECR_REGISTRY}/${ECR_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "db_image=${ECR_REGISTRY}/${ECR_DB_REPOSITORY}" >> $GITHUB_OUTPUT
          echo "image_tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build app image
        run: |
          docker build --file docker/app.Dockerfile \
            --tag ${{ steps.meta.outputs.app_image }}:${{ steps.meta.outputs.image_tag }} .

      - name: Build db image
        run: |
          docker build --file docker/db.Dockerfile \
            --tag ${{ steps.meta.outputs.db_image }}:${{ steps.meta.outputs.image_tag }} docker/

      - name: Scan app image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.meta.outputs.app_image }}:${{ steps.meta.outputs.image_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan db image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ steps.meta.outputs.db_image }}:${{ steps.meta.outputs.image_tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Push images to ECR
        run: |
          aws ecr get-login-password --region ${AWS_REGION} \
            | docker login --username AWS --password-stdin ${{ steps.meta.outputs.ecr_registry }}
          for image in "${{ steps.meta.outputs.app_image }}" "${{ steps.meta.outputs.db_image }}"; do
            docker tag ${image}:${{ steps.meta.outputs.image_tag }} ${image}:latest
            docker push ${image}:${{ steps.meta.outputs.image_tag }}
            docker push ${image}:latest
          done

  update-helm:
    if: github.event_name == 'push'
    name: Update Helm values in separate repo
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v6

      - name: Install yq
        run: |
          YQ_VERSION="v4.45.1"
          curl -L "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Clone Helm repository
        run: |
          git clone https://${{ secrets.HELM_REPO_USER }}:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/${{ env.HELM_REPO_NAME }}.git helm-repo

      - name: Update Helm values.yaml images and tags
        run: |
          cd helm-repo
          yq eval '
            .app.image = strenv(APP_IMAGE) | .app.tag = strenv(IMAGE_TAG) |
            .db.image  = strenv(DB_IMAGE)  | .db.tag  = strenv(IMAGE_TAG)
          ' -i helm/accounts/values.yaml
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          APP_IMAGE: ${{ needs.docker-build-push.outputs.app_image }}
          DB_IMAGE: ${{ needs.docker-build-push.outputs.db_image }}

      - name: Commit and push Helm repo update
        run: |
          cd helm-repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          if ! git diff --quiet; then
            git add helm/accounts/values.yaml
            git commit -m "Update image tags to ${IMAGE_TAG}"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          GIT_AUTHOR_NAME: github-actions
          GIT_AUTHOR_EMAIL: actions@github.com
