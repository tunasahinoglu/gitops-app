sonar.projectKey=gitops-app
sonar.projectName=gitops-app
sonar.projectVersion=1.0

sonar.sources=src/
sonar.java.binaries=target/classes

sonar.junit.reportsPath=target/surefire-reports/
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.checkstyle.reportPaths=target/checkstyle-result.xml

# JSP view templates are pre-existing reference-app boilerplate with heavy
# structural duplication (shared layout copy-pasted per page, no JSP
# includes/tags). Not the focus of this project's CI/CD work, so excluded
# from duplication analysis.
sonar.cpd.exclusions=src/main/webapp/WEB-INF/views/**/*.jsp