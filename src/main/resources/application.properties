# Database
# Credentials come from the environment (Kubernetes secrets in the deployed
# setup), so nothing sensitive is committed here.
jdbc.driverClassName=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://${DB_HOST:localhost}:3306/accounts?useUnicode=true&characterEncoding=UTF-8&zeroDateTimeBehavior=convertToNull
jdbc.username=${DB_USER:root}
jdbc.password=${DB_PASS}

# Memcached
memcached.active.host=${MEMCACHED_HOST:localhost}
memcached.active.port=11211
memcached.standBy.host=127.0.0.2
memcached.standBy.port=11211

# RabbitMQ
rabbitmq.address=${RMQ_HOST:localhost}
rabbitmq.port=5672
rabbitmq.username=${RMQ_USER:guest}
rabbitmq.password=${RMQ_PASS}

# Elasticsearch
elasticsearch.host=localhost
elasticsearch.port=9300
elasticsearch.cluster=accounts
elasticsearch.node=accountsnode

spring.servlet.multipart.max-file-size=128KB
spring.servlet.multipart.max-request-size=128KB

logging.level.org.springframework.security=INFO

spring.security.user.name=${ADMIN_USER:admin}
spring.security.user.password=${ADMIN_PASS}
spring.security.user.roles=ADMIN

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type=OFF
